name: Validate
on:
  pull_request:
  push:
    branches: [main, phase8/staging-deployment]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend exec next typegen
      - run: pnpm --dir frontend typecheck
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy app tests
      - run: uv run --no-sync pytest -q
      - run: docker build -f backend/Dockerfile.prod -t stay-insight-api:ci backend
        working-directory: .
      - run: docker run --rm --entrypoint python stay-insight-api:ci -c "import os; assert os.getuid()!=0; assert not os.path.exists('/app/tests'); assert not os.path.exists('/app/.env')"
        working-directory: .
